name: Publish container
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ianphil/genesis-durable:latest
            ghcr.io/ianphil/genesis-durable:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ianphil/genesis-durable
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Request provisioner deployment
        if: github.ref == 'refs/heads/main'
        env:
          DEMIGOD_DEPLOY_URL: https://ais-mac-mini.taile9ce97.ts.net/deploy
          DEMIGOD_DEPLOY_SECRET: ${{ secrets.DEMIGOD_DEPLOY_SECRET }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: python3 scripts/notify-deploy.py
